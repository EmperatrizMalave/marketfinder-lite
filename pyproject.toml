[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketfinder-lite"
version = "0.0.1"
description = "Herramienta de escritorio para investigación de productos en Mercado Libre México (Etapa 1)."
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
authors = [{ name = "MarketFinder Lite" }]
dependencies = [
    "customtkinter>=5.2.2,<6",
    "python-dotenv>=1.0.0,<2",
    "darkdetect>=0.8.0,<1",
    "pandas>=2.2.0,<3",
    "openpyxl>=3.1.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9",
]

[project.scripts]
marketfinder = "marketfinder.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
